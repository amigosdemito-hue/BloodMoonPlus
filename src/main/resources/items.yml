# ============================================================
#  ITEMS (vanilla y custom). La rareza decide cuándo caen (ver loot.yml).
#  Campos: material, name, lore, rarity, enchants, unbreakable, glow,
#          item-model.
#
#  CATÁLOGO: cada clase de arma, herramienta y armadura tiene una versión de CADA rareza
#  (COMUN, POCO_COMUN, RARO, EPICO, LEGENDARIO y MITICO). Los materiales suben con la
#  rareza (madera -> piedra -> hierro -> diamante -> netherita) y los encantamientos
#  también: los legendarios y míticos llevan los más potentes de ExcellentEnchants.
#
#  ENCANTAMIENTOS: solo encantamientos REALES del servidor.
#    - Vanilla: se escribe el id (sharpness, protection, unbreaking...) y el nivel se recorta
#      al máximo de cada uno (filo 5, irrompible 3...). En items LEGENDARIO y MITICO el tope
#      sube a 5 aunque vanilla no llegue (protección 5, espinas 5...). Un 7 aquí queda en 5:
#      no se permiten niveles por encima de 5.
#    - ExcellentEnchants: se escribe su id (thunder, vampire, tunnel, veinminer...). Necesitan
#      ExcellentEnchants (+ NightCore) instalado; si falta, se omiten con un aviso y el resto
#      del item se crea igual. El nivel máximo lo fija ExcellentEnchants.
#      IMPORTANTE: cada encantamiento de EE solo acepta ciertos materiales (por ejemplo Tunnel
#      y Veinminer, herramientas de minería; Dragon Heart y Fire Shield, petos; Night Vision,
#      cascos). Si un id no aplica al material, el servidor lo omite: al arrancar el plugin
#      avisa en el log con "encantamientos que no se pueden aplicar al material".
#    - Sin tope de customs: un mítico puede llevar 5-6. Se listan arriba de la lore.
#
#  MALDICIONES: ningún objeto de la Luna lleva maldiciones (ni de desaparición ni de vínculo),
#               así que al morir caen al suelo como cualquier objeto. Si un objeto repartido con
#               la 1.0.2 trae vanishing_curse, se le quita solo al entrar al servidor, al
#               recogerlo del suelo y con /luna refresh <jugador|all>.
#
#  NO hay límite de ejemplares: un mítico puede caer tantas veces como salga.
#  Placeholders de lore: {owner} {rarity}
#  La linea de rareza y la de cazador se anaden SOLAS a cualquier objeto con nombre (el dueno
#  sale de quien lo consiguio); no hace falta escribirlas en el lore de cada item.
# ============================================================

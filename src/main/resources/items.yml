# ============================================================
#  ITEMS (vanilla y custom). La rareza decide cuándo caen (ver loot.yml).
#  Campos: material, name, lore, rarity, enchants, unbreakable, glow,
#          item-model, limit (máx. ejemplares en TODO el servidor, con número de serie).
#
#  ENCANTAMIENTOS: solo encantamientos REALES del servidor.
#    - Vanilla: se escribe el id (sharpness, protection, unbreaking...) y el nivel se recorta
#      al máximo de cada uno (filo 5, irrompible 3...). En items LEGENDARIO y MITICO el tope
#      sube a 5 aunque vanilla no llegue (protección 5, espinas 5...). Un 7 aquí queda en 5:
#      no se permiten niveles por encima de 5.
#    - ExcellentEnchants: se escribe su id (thunder, vampire, dragon_heart...). Necesitan
#      ExcellentEnchants (+ NightCore) instalado; si falta, se omiten con un aviso y el resto
#      del item se crea igual. El nivel máximo lo fija ExcellentEnchants.
#    - Máximo 3 encantamientos custom por item.
#
#  MALDICIONES: ningún objeto de la Luna lleva maldiciones (ni de desaparición ni de vínculo),
#               así que al morir caen al suelo como cualquier objeto. Si un objeto repartido con
#               la 1.0.2 trae vanishing_curse, se le quita solo al entrar al servidor, al
#               recogerlo del suelo y con /luna refresh <jugador|all>.
#
#  Placeholders de lore: {owner} {rarity}
# ============================================================

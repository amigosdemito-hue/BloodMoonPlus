# ============================================================
#  ITEMS (vanilla y custom). La rareza decide cuándo caen (ver loot.yml).
#  Campos: material, name, lore, rarity, enchants, unbreakable, glow,
#          item-model, limit (máx. ejemplares en TODO el servidor, con número de serie),
#          abilities, passives.
#  ENCANTAMIENTOS: el nivel NUNCA supera settings.max-enchant-level (7 por defecto);
#                  cualquier valor mayor se recorta al cargar.
#  ATRIBUTOS = passives (efectos de poción mientras se porta el item):
#                  strength:1  resistance:0  health_boost:2  speed:1  regeneration:0
#                  fire_resistance:0  night_vision:0  slow_falling:0  jump_boost:1 ...
#                  HEAL_AURA:radio:curacion  (cura a aliados cercanos)
#  Habilidades arma:     DAMAGE_BONUS:f  LIFESTEAL:f  LIGHTNING:prob:daño  IGNITE:prob:seg  WITHER:prob:seg
#                        SLOW:prob:seg  EXECUTE:vidaFrac:bonusFrac  BOSS_SLAYER:f
#                        CHAIN_LIGHTNING:prob:cadenas:daño:decaimiento  POISON:prob:seg:nivel
#                        BLEED:prob:seg:nivel  CRIT:prob:multiplicador
#  Habilidades armadura: DAMAGE_REDUCTION:f  DODGE:prob  THORNS:prob:daño  REFLECT:f
#                        THUNDER_GUARD:prob:daño:attacker|self   <- rayo al recibir un golpe (sin tormenta)
#                        BLAST_WAVE:prob:daño:fuerza             <- onda expansiva, NO rompe bloques
#                        LEVITATE:prob:seg:nivel                 <- el atacante levita
#  Placeholders de lore: {owner} {rarity}
# ============================================================
settings:
  show-rarity-line: true
  # Nivel máximo de encantamiento (el usuario pidió 7; no se debe pasar de aquí).
  max-enchant-level: 7


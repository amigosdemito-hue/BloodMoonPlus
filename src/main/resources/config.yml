# ============================================================
#  BloodMoonPlus - configuración principal
#
#  ACTUALIZACIONES: este archivo NO se sobrescribe al actualizar el plugin. Al
#  arrancar se AÑADEN las claves nuevas de esta versión (cleanup, items,
#  discord… con sus comentarios) al final de su sección, y antes se guarda un
#  config.yml.pre-vN.bak. Tus valores, tus comentarios y tus claves propias no
#  se tocan nunca. `config-version` marca la versión del archivo: con el mismo
#  número o mayor no se añade nada (súbelo a mano si quieres congelarlo).
# ============================================================
config-version: 2

# Mundos donde ocurre el evento (si un horario no define los suyos).
worlds:
  - world

# ------------------------------------------------------------
#  PROGRAMACIÓN DEL EVENTO — 2 MODOS
# ------------------------------------------------------------
#
#  MODO 1: "weekly" (por defecto)
#  Por día de la semana a hora fija en zona horaria (hora México).
#  Cada día puede tener una o varias horas. Un día sin entrada NO tiene evento.
#  Ejemplo: cada LUNES a las 14:00 hora México:
#
#    schedule:
#      mode: weekly
#      days:
#        MONDAY:
#          - "14:00"
#
#  DOS CALENDARIOS LISTOS (mira schedule.days más abajo):
#
#    OPCIÓN 1 — la de por defecto: 2 lunas por semana,
#               MIÉRCOLES 09:30 y SÁBADO 17:30 (hora México).
#
#    OPCIÓN 2 — una luna DÍA POR MEDIO (lunes, miércoles, viernes y domingo),
#               el calendario de las versiones anteriores. Va comentada dentro de
#               `days:`: para usarla, comenta el bloque de la OPCIÓN 1 y quita
#               el "#" de la OPCIÓN 2.
#
#  MODO 2: "interval"
#  Cada N horas reales (ej. cada 72h = cada 3 días reales).
#  El temporizador corre aunque el servidor esté apagado.
#  Ejemplo: cada 72 horas:
#
#    schedule:
#      mode: interval
#      interval-hours: 72
#
#  Las horas SIEMPRE entre comillas: "21:30"  (formato 24 h).
#  En modo weekly, cada hora puede ser texto simple o un bloque con opciones:
#        - time: "20:40"
#          difficulty: 3          # x3 (triple)
#          duration-minutes: 25
#          worlds: [world]        # opcional
# ------------------------------------------------------------
schedule:
  enabled: true
  mode: weekly                   # weekly | interval
  timezone: "America/Mexico_City"
  interval-hours: 72            # solo para modo interval
  grace-seconds: 180            # si el servidor estaba apagado a la hora exacta, aún se dispara dentro de este margen
  skip-if-no-players: true      # no inicia el evento si el mundo está vacío
  warnings-minutes: [10, 5, 1]  # avisos antes de empezar
  days:
    # ---- OPCIÓN 1 (ACTIVA, la de por defecto): 2 lunas por semana ----
    WEDNESDAY:
      - time: "09:30"
        difficulty: 1.5        # x1.5 — mañana del miércoles
        duration-minutes: 20
    SATURDAY:
      - time: "17:30"
        difficulty: 2          # x2 — tarde del sábado (fin de semana)
        duration-minutes: 25

    # ---- OPCIÓN 2: una luna DÍA POR MEDIO (calendario de antes) ----
    # Para usarla: comenta (o borra) la OPCIÓN 1 y quita el "#" de estas líneas.
    # MONDAY:
    #   - time: "21:30"
    #     difficulty: 1          # x1 — arranque de semana (suave)
    #     duration-minutes: 20
    # WEDNESDAY:
    #   - time: "14:30"
    #     difficulty: 1.5        # x1.5 — tarde del miércoles
    #     duration-minutes: 20
    #   - time: "23:00"
    #     difficulty: 2          # x2 — noche del miércoles
    #     duration-minutes: 20
    # FRIDAY:
    #   - time: "13:40"
    #     difficulty: 2          # x2 — tarde del viernes
    #     duration-minutes: 20
    #   - time: "20:40"
    #     difficulty: 3          # x3 — evento estrella (viernes noche, más largo)
    #     duration-minutes: 25
    # SUNDAY:
    #   - time: "08:30"
    #     difficulty: 2.5        # x2.5 — mañana del domingo
    #     duration-minutes: 20
    #   - time: "18:30"
    #     difficulty: 3          # x3 — cierre del fin de semana (más largo)
    #     duration-minutes: 25

# ------------------------------------------------------------
#  EVENTO
# ------------------------------------------------------------
event:
  duration-minutes: 20
  global: true                 # true: el evento arranca en TODOS los mundos cargados al mismo tiempo
                               #       (hordas, jefes, barra, noche y participantes en cada mundo).
                               # false: solo en los mundos de la lista "worlds" de abajo.
  lock-night: true              # fija la noche durante el evento
  night-time-ticks: 18000
  end-time-ticks: 23000         # hora del mundo al terminar (amanecer cercano)
  clear-weather: true
  first-wave-delay-seconds: 3   # segundos exactos del arranque a la primera horda
  remove-mobs-on-end: true
  force-difficulty: true           # sube la dificultad del mundo a EASY si está en Pacífico (necesario para spawnear mobs); se restaura al terminar
  protect-terrain: true            # las explosiones de mobs (creepers, etc.) NO rompen bloques; el jefe de la Luna SÍ los rompe (como el Wither vanilla)
  block-wither-spawn: true        # bloquea el spawn de CUALQUIER Wither excepto el jefe de la Luna (tag bloodmoon_boss); desactívalo si quieres Withers normales
  reward-on-stop: false         # dar recompensa a supervivientes si se detiene con /luna stop
  commands-on-start: []         # consola; {world}
  commands-on-end: []
  survivor-commands: []         # consola, por superviviente; {player}  ej: "eco give {player} 500"

# ------------------------------------------------------------
#  ANUNCIOS DE CHAT
#  Por defecto SOLO se anuncian hordas, jefes y loot. Todo lo demás
#  (muertes de mobs, muertes de jugadores, inicio/fin del evento,
#  especiales, supervivientes y avisos) está apagado para que el chat
#  no se sature. Cambia a true lo que quieras volver a ver.
#  Efectivo con /luna reload
# ------------------------------------------------------------
announce:
  horde: true                 # "¡Las hordas descienden sobre <jugador>!"
  bosses: true                # aparición de jefes, su caída y el top de daño
  loot: true                  # drop LEGENDARIO / MÍTICO conseguido
  mob-kills: false            # "Nova ha matado a Zombi Sanguinario" (1 de cada 5 muertes)
  player-deaths: false        # "Nova ha muerto por <causa>"
  event: false                # inicio, fin y resumen del evento
  specials: false             # eclipse, tormenta, niebla, silencio
  survivors: false            # resultados de supervivientes
  warnings: false             # avisos 10/5/1 min antes de que empiece

# ------------------------------------------------------------
#  DISCORD — avisos al canal por webhook
#  Crea el webhook en Discord: Ajustes del canal → Integraciones
#  → Webhooks → Nuevo webhook → Copiar URL del webhook.
#  No hace falta un bot ni un token. Efectivo con /luna reload.
#  Cada aviso es un embed: título, cuenta atrás en vivo de Discord y campos.
#  Mientras el evento esté activo no se envían cuentas atrás.
# ------------------------------------------------------------
discord:
  enabled: false
  webhook-url: ""                      # https://discord.com/api/webhooks/...
  username: "Luna de Sangre"           # nombre con el que firma el mensaje
  avatar-url: ""                       # opcional: avatar del webhook
  warnings-minutes: [120, 60]          # cuenta atrás: 2 h y 1 h antes del evento.
                                       # lista vacía = sin cuenta atrás.
                                       # No se manda si ya hay una luna en marcha.
  notify:
    warnings: true                     # "la luna empieza en X min"
    start: true                        # al arrancar el evento
    end: true                          # al terminar o al detenerlo con /luna stop

# ------------------------------------------------------------
#  DIFICULTAD
#  Multiplicador N (x1 normal, x3 triple...). Cada estadística usa:
#      valor = base * (1 + (N - 1) * factor)
#  Con factor 1.0 y x3 => exactamente el triple.
# ------------------------------------------------------------
difficulty:
  default: 1.0
  max: 10.0
  scaling:
    health: 1.0          # vida de los mobs
    damage: 1.0          # daño de los mobs
    speed: 0.1           # velocidad
    horde-size: 1.0      # tamaño de la oleada (limitado por horde.wave-max-size)
    spawn-speed: 0.5     # frecuencia de oleadas
    loot-chance: 0.25    # probabilidad base de que un mob suelte loot
    rarity-luck: 0.5     # sube el peso de las rarezas marcadas luck-affected

# ------------------------------------------------------------
#  HORDAS
# ------------------------------------------------------------
horde:
  enabled: true
  interval-seconds: 30         # cada cuánto cae una horda (30 s = una horda, se espera, y otra)
  base-size: 7                 # mobs por horda y por jugador. El tamaño NO crece con cada oleada:
                               # cada 30 s cae otra horda de 7 (antes 5, 10, 15... hasta 30)
  wave-max-size: 7             # tope del tamaño de una horda (con base-size 7 queda fijo en 7)
  max-alive-total: 1000        # Techo del servidor: horda + esbirros, todos los mundos
  max-alive-per-player: 40     # Techo por jugador: mobs y esbirros de jefe
                               # Los JEFES no cuentan en ninguno de los dos: tienen su cupo propio
                               # y prioritario, así que nunca se quedan sin invocar ni te llevan
                               # por encima de 40. Los esbirros que invocan SÍ van dentro de los 40.
                               # El suelo de ~30 vivos se alcanza acumulando hordas de 7
  spawn-distance: { min: 14, max: 28 }
  require-armor:               # solo caen hordas en jugadores con armadura mínima
    enabled: false
    min-pieces: 4
    materials: [DIAMOND, NETHERITE]
  mobs:
    - type: ZOMBIE
      weight: 48
      damage-multiplier: 1.3
      speed-multiplier: 1.05
      name: "<red>Zombi Sanguinario"
      equipment: { main-hand: IRON_SWORD, head: IRON_HELMET, chest: IRON_CHESTPLATE }
      equipment-chance: 0.5
    - type: SKELETON
      weight: 16
      damage-multiplier: 1.2
      name: "<red>Esqueleto Sanguinario"
      equipment: { head: IRON_HELMET }
      equipment-chance: 0.4
    - type: HUSK
      weight: 12
      damage-multiplier: 1.3
      name: "<gold>Husk Carmesí"
    - type: SPIDER
      weight: 16
      damage-multiplier: 1.2
    - type: CREEPER
      weight: 8
    - type: WITHER_SKELETON
      weight: 5
      damage-multiplier: 1.1
      name: "<dark_red>Verdugo Menor"
      loot-table: mob_elite
    - type: DROWNED
      weight: 10
      damage-multiplier: 1.1
      name: "<blue>Ahogado Abisal"
    - type: STRAY
      weight: 6
      damage-multiplier: 1.15
      name: "<gray>Esqueleto de Hielo"
    - type: BOGGED
      weight: 6
      damage-multiplier: 1.0
      name: "<green>Bogged Pantanoso"
    - type: PILLAGER
      weight: 8
      damage-multiplier: 1.2
      equipment: { main-hand: CROSSBOW }
      equipment-chance: 0.7
      name: "<dark_gray>Saqueador de la Luna"
    - type: VINDICATOR
      weight: 8
      damage-multiplier: 1.4
      equipment: { main-hand: IRON_AXE }
      equipment-chance: 0.8
      name: "<red>Vindicador Carmesí"
    - type: RAVAGER
      weight: 2
      damage-multiplier: 1.6
      health: 80
      name: "<dark_red>Devastador de Sangre"

# ------------------------------------------------------------
#  LIMPIEZA DE BASURA DEL EVENTO
#  Cada flecha, tridente o virot de un mob de la Luna es una entidad más, y las
#  flechas clavadas NO desaparecen solas: con 40 mobs vivos y esqueletos
#  disparando, el mundo acaba con miles y el TPS cae. Esto barre todo eso
#  durante el evento y al terminar (ver event.remove-mobs-on-end).
#  Solo toca lo del evento: los proyectiles y drops de los jugadores no se
#  tocan (se filtran por el tirador y por la marca del loot).
# ------------------------------------------------------------
cleanup:
  enabled: true
  interval-seconds: 45            # cada cuánto se barre mientras hay Luna de Sangre
  projectiles: true               # flechas, tridentes, virotes, bolas de fuego... de los mobs
  projectile-max-age-seconds: 20  # un proyectil del evento se borra a los N segundos
  max-projectiles-per-world: 150  # tope de proyectiles del evento vivos por mundo (se van los más viejos)
  items: true                     # loot del evento tirado en el suelo
  item-min-age-seconds: 90        # ...y que lleva más de N segundos sin que nadie lo recoja

# ------------------------------------------------------------
#  ITEMS
# ------------------------------------------------------------
items:
  # Puesta al día al entrar: recorta niveles por encima de vanilla y borra las viejas
  # habilidades de item. Ponlo en false si prefieres migrar a mano con /luna refresh.
  migrate-on-join: true

# ------------------------------------------------------------
#  LOOT
# ------------------------------------------------------------
loot:
  default-table: mob_horde
  survivor-table: survivors
  direct-to-inventory: false    # true: el loot va directo al inventario del que mata
  require-player-kill: true
  keep-vanilla-drops: false
  glow-rarities: [LEGENDARIO, MITICO]   # items que brillan e ignoran lava/explosiones al caer

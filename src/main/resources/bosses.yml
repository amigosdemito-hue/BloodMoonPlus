# ============================================================
#  JEFES
#  Habilidades (nombre:cooldown_seg:args...):
#    SUMMON:cd:cantidad:TIPO              invoca refuerzos
#    SLAM:cd:radio:daño_base              golpe de área con empuje
#    LIGHTNING:cd:objetivos:daño_base     rayos sobre jugadores cercanos
#    AURA:cd:radio:efecto:seg:nivel       efecto de poción a jugadores cercanos (ej. wither)
#    SONIC_BOOM:cd:radio:daño_base        onda expansiva que lanza lejos a los jugadores (Warden)
#    PULL:cd:radio:fuerza                 atrae a los jugadores hacia el jefe
#    SKULL:cd:cantidad                    dispara calaveras de wither a los jugadores (el jefe SÍ rompe bloques)
#    CHARGE:cd:fuerza:daño_base           embestida: se lanza hacia un jugador y arrolla ~1s (Devastador)
#    ROAR:cd:radio:efecto:seg:nivel       rugido que aplica un efecto en área (ej. darkness)
#    GUARD:cd:segundos                    bloqueo: resistencia + absorción temporal (escudo)
#    SELF_HEAL:cd:cantidad                se regenera vida (jefe tanque)
#  SEGUNDA FASE (enloquecido) — opcional por jefe:
#    enrage-at: 0.5          # fracción de vida que lo activa (0 = desactivado)
#    enrage-cooldown: 0.6    # multiplicador de cooldown de habilidades al enloquecer (<1 = más rápido)
#    enrage-damage: 1.5      # multiplicador de daño de habilidades al enloquecer
#  Al activarse: +Velocidad II, +Fuerza II, todas las habilidades se recargan al instante.
#  El daño base se multiplica por "damage" del jefe y por la dificultad.
#  La vida máxima se limita a 1024 (límite del juego) tras multiplicar por dificultad.
# ============================================================

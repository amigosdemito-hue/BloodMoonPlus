  boss-failed-target: "<red>Impossibile evocare {boss} su {player} (morto, in un altro mondo o evento inattivo lì?)."
  boss-failed: "<red>Impossibile evocare il boss {boss}: nessun giocatore idoneo nel mondo dell'evento."
  boss-unknown: "<red>Il boss {boss} non esiste. Boss: {bosses}"
  horde-spawned: "<green>Orda generata: {count} mob."
  horde-spawned-player: "<green>Orda per {player}: {count} mob."
  killed: "<green>Rimossi {count} mob della Luna di Sangue."
  usage-give: "<yellow>Uso: /luna give <giocatore> <item> [quantità]"
  player-unknown: "<red>Giocatore {player} non trovato."
  item-unknown: "<red>L'item {item} non esiste (usa /luna items)."
  target-unknown: "<red>Non esiste nessun giocatore o mondo chiamato {target}."
  boss-spawned-world: "<green>Boss {boss} evocato in {world}."
  boss-usage-no-event: "<red>Senza evento attivo usa /luna boss <id> <giocatore|mondo>."
  given: "<green>Consegnati {amount}x {item} a {player}."
  items-header: "<gold>Item disponibili:"
  usage-chances: "<yellow>Uso: /luna chances <tabella>"

  disabled: "<yellow>Luna di Sangue disattivata: nessun altro evento finché non usi <white>/luna enable<yellow>. Le lune in corso finiscono da sole (/luna stop per interromperle)."
  enabled: "<green>Luna di Sangue attivata: gli eventi tornano al calendario."
  disable-noop: "<gray>La Luna di Sangue era già disattivata."
  enable-noop: "<gray>La Luna di Sangue era già attivata."
  start-disabled: "<red>La Luna di Sangue è disattivata: non si può avviare. Usa /luna enable."
  status-disabled: "<red>Luna di Sangue DISATTIVATA <gray>· nessun evento fino a <white>/luna enable"
  next-disabled: "<gray>La Luna di Sangue è disattivata: nessun evento in arrivo."
  usage-difficulty: "<yellow>Uso: /luna difficulty <x3|x2|triple> [mondo]"
  difficulty-set: "<green>Difficoltà cambiata a x{difficulty}. Influisce sui mob che appariranno da ora."
  usage-boss: "<yellow>Uso: /luna boss <id> [giocatore]. Boss: {bosses}"

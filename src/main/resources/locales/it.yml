LocalesVersion: "2.0.0"
LanguageName: "Italiano"

# ==================== General ====================
prefix: "<dark_red><bold>🌙 Luna di Sangue</bold> <dark_gray>» <reset>"
no-permission: "<red>Non hai il permesso per farlo."
unknown-world: "<red>Quel mondo non esiste o non è caricato."
general-error: "<red>Si è verificato un errore durante l'elaborazione della richiesta."
bed-not-allowed: "<red>Non puoi dormire durante una Luna di Sangue."
dying-results-inventory-loss: "<dark_red><bold>Morire durante una Luna di Sangue cancella il tuo inventario."
dying-results-xp-loss: "<dark_red><bold>Morire durante una Luna di Sangue azzera la tua esperienza."

# ==================== Event ====================
event:
  title: "<dark_red><bold>🌙 LUNA DI SANGUE"
  subtitle: "<red>Sopravvivi fino all'alba <gray>(x{difficulty})"
  start: "<red>La Luna di Sangue è iniziata! <gray>Difficoltà <red>x{difficulty}<gray> · Durata <white>{minutes} min"
  end: "<green>La Luna di Sangue è finita. Arriva l'alba!"
  stopped: "<yellow>La Luna di Sangue è stata fermata."
  bar: "<dark_red>🌙 Luna di Sangue <gray>· <white>{time} <gray>· <red>x{difficulty}"
  summary-header: "<gold>Migliori cacciatori della notte:"
  summary-line: "<gray>{pos}. <white>{player} <dark_gray>— <red>{kills} uccisioni"
  survivors: "<green>Sei sopravvissuto alla Luna di Sangue! Ecco la tua ricompensa."
  horde-descending: "<dark_red><bold>⚡ Un'orda sta piombando su <white>{player}<dark_red>! ⚡"
  player-died: "<dark_red>☠ <white>{player} <dark_red>è caduto durante la Luna di Sangue. <gray>(<white>{cause}<gray>)"
  mob-slain: "<gray>× <white>{player} <gray>ha sconfitto <red>{mob}<gray>."
  death-cause-unknown: "<gray>la notte lo ha consumato"
  wither-blocked: "<red>Il Wither è vietato su questo server. Solo il boss della Luna di Sangue può apparire."
  survivors-header: "<gold>Sopravvissuti in {world}:"
  survivors-none: "<gray>Nessuno era idoneo alla ricompensa sopravvissuti in {world}."
  survivor-disqualified-death: "<red>Sei morto e non puoi più ricevere la ricompensa di sopravvivenza."
  survivor-insufficient-participation: "<yellow>Non hai partecipato abbastanza a lungo per ricevere la ricompensa di sopravvivenza."
  survivor-disqualified-world-leave: "<red>Hai lasciato il mondo dell'evento e non puoi più ricevere la ricompensa di sopravvivenza."
  already-active: "<red>C'è già un evento attivo in quel mondo."
  not-active: "<red>Nessun evento attivo."

# ==================== Schedule ====================
schedule:
  warning: "<yellow>La Luna di Sangue inizierà tra <red>{min} minuto/i <gray>(x{difficulty})<yellow>. Preparatevi!"

# ==================== Boss ====================
boss:
  spawn: "<dark_red>☠ {boss} <dark_red>è apparso!"
  enraged: "<dark_red><bold>{boss} <dark_red><bold>È IMPAZZITO! <red>Diventa più veloce e letale."
  killed: "<green>{boss} <green>è caduto! Colpo finale di <white>{player}<green>."
  top-header: "<gold>Danno maggiore al boss:"
  top-line: "<gray>{pos}. <white>{player} <dark_gray>— <red>{damage} danni"
  top-reward: "<gold>Per i danni al boss ricevi una ricompensa extra."
  disabled: "<yellow>Il boss della Luna di Sangue è disattivato in questo mondo."
  mythic-not-found: "<red>Il MythicMob '{name}' non è stato trovato in {world}."
  mythic-unavailable: "<red>MythicMobs non è disponibile o non è compatibile in {world}."
  mythic-fallback: "<gray>Verrà usato il boss vanilla della Luna di Sangue in {world}."

# ==================== Loot ====================
loot:
  broadcast: "<yellow>{player} <yellow>ha ottenuto {item} <dark_gray>[{rarity}<dark_gray>]<yellow>!"

# ==================== Items ====================
item:
  rarity-line: "<gray>Rarità: {rarity}"
  owner-line: "<dark_gray>Cacciato da <white>{owner}"
  owner-unknown: "<dark_gray>Cacciatore sconosciuto"
  no-disenchant: "<red>Gli oggetti della Luna di Sangue non perdono incantesimi né maledizioni."
  updated: "<green>I tuoi oggetti della Luna sono stati aggiornati con le ultime migliorie."


# Selector de idioma para BloodMoonPlus 2.0
# Idiomas incluidos: es (Español), en (English), pt (Português), fr (Français),
#                    de (Deutsch), it (Italiano), ru (Русский)
# Ejemplo: Language: pt
# Si el código no existe, el plugin avisa en consola y usa inglés.
LocalesVersion: "2.0.0"
Language: es
# Si true, usa los archivos del JAR como base y las claves faltantes caen al inglés.
# Si false, solo usa los archivos locales (más control, pero tú mantienes los textos).
UseBundledLocales: true

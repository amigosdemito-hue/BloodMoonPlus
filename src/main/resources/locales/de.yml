  usage-refresh: "<yellow>Benutzung: /luna refresh <spieler|all>"
  refreshed: "<green>{count} Blutmond-Gegenstand(-stände) von {player} aktualisiert."
  refreshed-all: "<green>{count} Blutmond-Gegenstand(-stände) bei allen Online-Spielern aktualisiert."
  started: "<green>Blutmond in {world} gestartet."
  stopped: "<yellow>Blutmond in {world} gestoppt."
  stopped-all: "<yellow>Alle Events wurden gestoppt."
  status-none: "<gray>Es ist kein Blutmond aktiv."
  status-line: "<red>● {world} <gray>· verbleibend <white>{time} <gray>· Schwierigkeit <red>x{difficulty}"
  next-line: "<gray>Nächster: <white>{when} <gray>(in {in}) · x{difficulty}"
  next-header: "<gold>Nächste Blutmonde:"
  next-entry: "<dark_gray>- <white>{when} <gray>· in {in} · <red>x{difficulty}"
  next-none: "<gray>Es sind keine Zeiten konfiguriert."
  usage-difficulty: "<yellow>Benutzung: /luna difficulty <x3|x2|triple> [welt]"
  difficulty-set: "<green>Schwierigkeit auf x{difficulty} geändert. Betrifft alle neu erscheinenden Monster."
  usage-boss: "<yellow>Benutzung: /luna boss <id> [spieler]. Bosse: {bosses}"
  usage-horde: "<yellow>Benutzung: /luna horde [spieler]"
  boss-spawned: "<green>Boss {boss} beschworen."
  boss-spawned-player: "<green>Boss {boss} über {player} beschworen."
  boss-failed-target: "<red>{boss} konnte nicht über {player} beschworen werden (tot, in einer anderen Welt oder dort kein Event?)."
  boss-failed: "<red>Boss {boss} konnte nicht beschworen werden: keine berechtigten Spieler in der Event-Welt."
  boss-unknown: "<red>Der Boss {boss} existiert nicht. Bosse: {bosses}"
  horde-spawned: "<green>Horde erzeugt: {count} Monster."
  horde-spawned-player: "<green>Horde für {player}: {count} Monster."
  killed: "<green>{count} Blutmond-Monster entfernt."
  usage-give: "<yellow>Benutzung: /luna give <spieler> <item> [menge]"
  player-unknown: "<red>Spieler {player} nicht gefunden."
  item-unknown: "<red>Der Gegenstand {item} existiert nicht (nutze /luna items)."
  item-limit: "<red>Der Gegenstand {item} hat das Limit von {limit} Einzelstücken erreicht."
  target-unknown: "<red>Es gibt keinen Spieler und keine Welt namens {target}."
  boss-spawned-world: "<green>Boss {boss} in {world} beschworen."
  boss-usage-no-event: "<red>Ohne aktives Event nutze /luna boss <id> <spieler|welt>."
  given: "<green>{amount}x {item} an {player} übergeben."
  items-header: "<gold>Verfügbare Gegenstände:"
  usage-chances: "<yellow>Benutzung: /luna chances <tabelle>"
  table-unknown: "<red>Die Tabelle {table} existiert nicht."
  survivors-header: "<gold>Berechtigte Überlebende in {world}:"
  survivors-line: "<gray>- <white>{player} <gray>({seconds} Teilnahme)"
  survivors-none: "<gray>Keine berechtigten Überlebenden in {world}."


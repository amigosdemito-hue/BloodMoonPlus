  started: "<green>Кровавая Луна запущена в {world}."
  stopped: "<yellow>Кровавая Луна остановлена в {world}."
  stopped-all: "<yellow>Все события остановлены."
  status-none: "<gray>Нет активной Кровавой Луны."
  status-line: "<red>● {world} <gray>· осталось <white>{time} <gray>· сложность <red>x{difficulty}"
  next-line: "<gray>Следующая: <white>{when} <gray>(через {in}) · x{difficulty}"
  next-header: "<gold>Ближайшие Кровавые Луны:"
  next-entry: "<dark_gray>- <white>{when} <gray>· через {in} · <red>x{difficulty}"
  next-none: "<gray>Расписание не настроено."
  usage-difficulty: "<yellow>Использование: /luna difficulty <x3|x2|triple> [мир]"
  difficulty-set: "<green>Сложность изменена на x{difficulty}. Влияет на мобов, которые появятся с этого момента."
  usage-boss: "<yellow>Использование: /luna boss <id> [игрок]. Боссы: {bosses}"
  usage-horde: "<yellow>Использование: /luna horde [игрок]"
  boss-spawned: "<green>Босс {boss} вызван."
  boss-spawned-player: "<green>Босс {boss} вызван над {player}."
  boss-failed-target: "<red>Не удалось вызвать {boss} над {player} (мёртв, в другом мире или там нет события?)."
  boss-failed: "<red>Не удалось вызвать босса {boss}: в мире события нет подходящих игроков."
  boss-unknown: "<red>Босса {boss} не существует. Боссы: {bosses}"
  horde-spawned: "<green>Орда создана: {count} мобов."
  horde-spawned-player: "<green>Орда для {player}: {count} мобов."
  killed: "<green>Удалено мобов Кровавой Луны: {count}."
  usage-give: "<yellow>Использование: /luna give <игрок> <item> [количество]"
  player-unknown: "<red>Игрок {player} не найден."
  item-unknown: "<red>Предмета {item} не существует (используйте /luna items)."
  target-unknown: "<red>Нет игрока или мира с именем {target}."
  boss-spawned-world: "<green>Босс {boss} вызван в {world}."
  boss-usage-no-event: "<red>Без активного события используйте /luna boss <id> <игрок|мир>."
  given: "<green>Выдано {amount}x {item} игроку {player}."
  items-header: "<gold>Доступные предметы:"
  usage-chances: "<yellow>Использование: /luna chances <таблица>"
  table-unknown: "<red>Таблицы {table} не существует."


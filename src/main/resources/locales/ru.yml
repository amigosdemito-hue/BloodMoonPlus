LocalesVersion: "2.0.0"
LanguageName: "Русский"

# ==================== General ====================
prefix: "<dark_red><bold>🌙 Кровавая Луна</bold> <dark_gray>» <reset>"
no-permission: "<red>У вас нет прав на это."
unknown-world: "<red>Такого мира нет или он не загружен."
general-error: "<red>Произошла ошибка при обработке запроса."
bed-not-allowed: "<red>Во время Кровавой Луны спать нельзя."
dying-results-inventory-loss: "<dark_red><bold>Смерть во время Кровавой Луны уничтожает ваш инвентарь."
dying-results-xp-loss: "<dark_red><bold>Смерть во время Кровавой Луны сбрасывает ваш опыт."

# ==================== Event ====================
event:
  title: "<dark_red><bold>🌙 КРОВАВАЯ ЛУНА"
  subtitle: "<red>Доживите до рассвета <gray>(x{difficulty})"
  start: "<red>Кровавая Луна началась! <gray>Сложность <red>x{difficulty}<gray> · Длительность <white>{minutes} мин"
  end: "<green>Кровавая Луна закончилась. Наступает рассвет!"
  stopped: "<yellow>Кровавая Луна была остановлена."
  bar: "<dark_red>🌙 Кровавая Луна <gray>· <white>{time} <gray>· <red>x{difficulty}"
  summary-header: "<gold>Лучшие охотники ночи:"
  summary-line: "<gray>{pos}. <white>{player} <dark_gray>— <red>{kills} убийств"
  survivors: "<green>Вы пережили Кровавую Луну! Получите награду."
  horde-descending: "<dark_red><bold>⚡ Орда обрушивается на <white>{player}<dark_red>! ⚡"
  player-died: "<dark_red>☠ <white>{player} <dark_red>пал во время Кровавой Луны. <gray>(<white>{cause}<gray>)"
  mob-slain: "<gray>× <white>{player} <gray>победил <red>{mob}<gray>."
  death-cause-unknown: "<gray>ночь поглотила его"
  wither-blocked: "<red>Визер запрещён на этом сервере. Появиться может только босс Кровавой Луны."
  survivors-header: "<gold>Выжившие в {world}:"
  survivors-none: "<gray>Никто не получил права на награду выжившего в {world}."
  survivor-disqualified-death: "<red>Вы погибли и больше не можете получить награду за выживание."
  survivor-insufficient-participation: "<yellow>Вы участвовали слишком мало, чтобы получить награду за выживание."
  survivor-disqualified-world-leave: "<red>Вы покинули мир события и больше не можете получить награду за выживание."
  already-active: "<red>В этом мире уже идёт событие."
  not-active: "<red>Нет активного события."

# ==================== Schedule ====================
schedule:
  warning: "<yellow>Кровавая Луна начнётся через <red>{min} мин. <gray>(x{difficulty})<yellow>. Приготовьтесь!"

# ==================== Boss ====================
boss:
  spawn: "<dark_red>☠ {boss} <dark_red>появился!"
  enraged: "<dark_red><bold>{boss} <dark_red><bold>ОБЕЗУМЕЛ! <red>Он стал быстрее и смертоноснее."
  killed: "<green>{boss} <green>пал! Последний удар нанёс <white>{player}<green>."
  top-header: "<gold>Наибольший урон по боссу:"
  top-line: "<gray>{pos}. <white>{player} <dark_gray>— <red>{damage} урона"
  top-reward: "<gold>За урон по боссу вы получаете дополнительную награду."
  disabled: "<yellow>Босс Кровавой Луны отключён в этом мире."
  mythic-not-found: "<red>MythicMob '{name}' не найден в {world}."
  mythic-unavailable: "<red>MythicMobs недоступен или несовместим в {world}."
  mythic-fallback: "<gray>Будет использован ванильный босс Кровавой Луны в {world}."

# ==================== Loot ====================
loot:
  broadcast: "<yellow>{player} <yellow>получил {item} <dark_gray>[{rarity}<dark_gray>]<yellow>!"

# ==================== Items ====================
item:
  rarity-line: "<gray>Редкость: {rarity}"
  owner-line: "<dark_gray>Добыто: <white>{owner}"
  owner-unknown: "<dark_gray>Охотник неизвестен"
  no-disenchant: "<red>Предметы Кровавой Луны не теряют зачарования и проклятия."
  updated: "<green>Ваши предметы Кровавой Луны обновлены последними улучшениями."


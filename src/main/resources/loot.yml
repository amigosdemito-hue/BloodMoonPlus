      - { item: maza_oxidada, weight: 12, drop-chance: 0.35 }
      - { item: casco_cuero, weight: 14, drop-chance: 0.45 }
      - { item: peto_cuero, weight: 14, drop-chance: 0.45 }
      - { item: grebas_cuero, weight: 14, drop-chance: 0.45 }
      - { item: botas_cuero, weight: 14, drop-chance: 0.45 }
      - { item: escudo_astillado, weight: 12, drop-chance: 0.4 }
      # Poco comunes: materiales (casi siempre)
      - { item: oro, weight: 30, amount: "2-5", drop-chance: 0.95 }
      - { item: manzana_dorada, weight: 20, amount: "1", drop-chance: 0.9 }
      - { item: botella_xp, weight: 30, amount: "3-9", drop-chance: 0.9 }
      - { item: ojo_ender, weight: 15, amount: "1-2", drop-chance: 0.75 }
      - { item: obsidiana, weight: 15, amount: "1-3", drop-chance: 0.65 }
      # Poco comunes: equipo de hierro con mejores encantamientos (nada de piedra ni cadena)
      - { item: espada_piedra, weight: 20, drop-chance: 0.45 }
      - { item: hacha_piedra, weight: 20, drop-chance: 0.45 }
      - { item: pico_piedra, weight: 20, drop-chance: 0.45 }
      - { item: pala_piedra, weight: 18, drop-chance: 0.45 }
      - { item: azada_piedra, weight: 16, drop-chance: 0.4 }
      - { item: arco_hueso, weight: 18, drop-chance: 0.4 }
      - { item: ballesta_hueso, weight: 16, drop-chance: 0.4 }
      - { item: tridente_mares, weight: 10, drop-chance: 0.3 }
      - { item: maza_pesada, weight: 12, drop-chance: 0.3 }
      - { item: casco_cadena, weight: 14, drop-chance: 0.4 }
      - { item: peto_cadena, weight: 14, drop-chance: 0.4 }
      - { item: grebas_cadena, weight: 14, drop-chance: 0.4 }
      - { item: botas_cadena, weight: 14, drop-chance: 0.4 }
      - { item: escudo_reforzado, weight: 12, drop-chance: 0.35 }
      # Raros: materiales comunes más frecuentes; armas rotas siguen al 5%
      - { item: diamante, weight: 40, amount: "1-3", drop-chance: 0.55 }
      - { item: perla_ender, weight: 30, amount: "1-2", drop-chance: 0.5 }
      - { item: espada_sanguinaria, weight: 15, drop-chance: 0.05 }
      - { item: arco_carmesi, weight: 15, drop-chance: 0.05 }
      - { item: daga_sombras, weight: 14, drop-chance: 0.05 }
      - { item: arco_tormenta, weight: 14, drop-chance: 0.05 }
      - { item: pico_umbrial, weight: 12, drop-chance: 0.3 }

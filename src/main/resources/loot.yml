      - { item: fragmento_netherita, weight: 30, amount: "1-2", drop-chance: 0.4 }
      - { item: hacha_verdugo, weight: 10, drop-chance: 0.15 }
      - { item: casco_cazador, weight: 10, drop-chance: 0.12 }
      - { item: peto_cazador, weight: 10, drop-chance: 0.12 }

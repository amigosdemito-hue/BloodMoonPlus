# ============================================================
#  LOOT POR RAREZA
#  1) Se decide si el mob suelta algo (drop-chance de la tabla, sube con la dificultad).
#  2) Se elige la RAREZA según su peso (weight) -> luego el ITEM dentro de esa rareza según el peso del item.
#  - luck-affected: el peso sube con la dificultad (difficulty.scaling.rarity-luck).
#  - pity: cada tirada sin obtener esa rareza suma 1 "stack" por jugador Y POR TABLA; el peso
#    se multiplica por (1 + stacks * pity-per-roll). Al obtenerla se reinicia. La tabla forma
#    parte de la clave porque si no, matar mobs de la horda regalaba suerte en los jefes.
#  - Un mismo roll() no repite el mismo item si la tabla tiene alternativas.
#  - Los pesos y drop-chance se validan al cargar: un valor negativo, un NaN o >1 se avisa y
#    se ajusta en vez de desviar el sorteo en silencio.
#  - "rolls" puede ser rango (ej. 1-2): cuántos items intenta soltar por kill.
#  Mira los porcentajes reales con:  /bloodmoon chances <tabla>
# ============================================================
rarities:
  COMUN:
    display: "<white>Común"
    weight: 600
  POCO_COMUN:
    display: "<green>Poco común"
    weight: 250
  RARO:
    display: "<aqua>Raro"
    weight: 100
    luck-affected: true
  EPICO:
    display: "<light_purple>Épico"
    weight: 40
    luck-affected: true
    pity-per-roll: 0.02
    pity-max-stacks: 150
  LEGENDARIO:
    display: "<gold><bold>LEGENDARIO</bold>"
    weight: 10
    luck-affected: true
    broadcast: true
    pity-per-roll: 0.05
    pity-max-stacks: 200
  MITICO:
    display: "<gradient:#ff0040:#8a00ff><bold>MÍTICO</bold></gradient>"
    weight: 1.5
    luck-affected: true
    broadcast: true
    pity-per-roll: 0.08
    pity-max-stacks: 300

tables:
  # Tabla base de la horda (cada mob muerto por un jugador)
  #  - 50% de los mobs sueltan UN objeto (antes 60% con 1-2 tiradas: 2-3 objetos por kill).
  #  - Comunes = ~50% del sorteo. El equipo común ya es de HIERRO: nada de madera, cuero,
  #    piedra ni cadena saliendo por montones.
  #  - drop-chance por item: los materiales caen siempre (1.0), las armas raras muy pocas veces.
  mob_horde:
    drop-chance: 0.50
    rolls: 1
    rarity-weights: { COMUN: 500, POCO_COMUN: 360, RARO: 110, EPICO: 32, LEGENDARIO: 5, MITICO: 0.5 }
    entries:
      # Comunes: materiales (siempre caen; arriesgas la vida, no la vuelves a perder)
      - { item: carne, weight: 40, amount: "3-8", drop-chance: 1.0 }
      - { item: flechas, weight: 30, amount: "6-16", drop-chance: 1.0 }
      - { item: polvora, weight: 30, amount: "2-6", drop-chance: 1.0 }
      - { item: hierro, weight: 25, amount: "3-7", drop-chance: 1.0 }
      - { item: hueso, weight: 25, amount: "3-7", drop-chance: 1.0 }
      - { item: cuerda, weight: 20, amount: "2-5", drop-chance: 1.0 }
      # Comunes: equipo básico de cada clase (hierro: nada de madera ni cuero)
      - { item: espada_oxidada, weight: 20, drop-chance: 0.5 }
      - { item: hacha_oxidada, weight: 20, drop-chance: 0.5 }
      - { item: pico_oxidado, weight: 20, drop-chance: 0.5 }
      - { item: pala_oxidada, weight: 18, drop-chance: 0.5 }
      - { item: azada_oxidada, weight: 16, drop-chance: 0.45 }
      - { item: arco_astillado, weight: 18, drop-chance: 0.45 }
      - { item: ballesta_astillada, weight: 16, drop-chance: 0.45 }

name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "9.1.0" }
      # El wrapper fija la versión de Gradle del repositorio; `gradle` usaba la que instalara
      # setup-gradle y podía compilar con otra distinta a la de desarrollo.
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with: { name: BloodMoonPlus, path: build/libs/*.jar }
